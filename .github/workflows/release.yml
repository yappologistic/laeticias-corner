# Makes a release from a pushed tag `v<version>`: the Build workflow builds, tests, packages and
# proves both systems from the tag, then this attaches the archives and their checksums to a
# draft pre-release with the notes from docs/releases/<version>.md. A person reviews the draft
# and publishes it. Only the last job can write, and only to this repository's releases.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/build.yml
    permissions:
      contents: read

  draft:
    name: Draft the release
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: docs/releases

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: package-*
          path: kits

      - name: Create the draft pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          version=${TAG#v}
          notes=docs/releases/$version.md
          [[ -f $notes ]] || { echo "no release notes at $notes" >&2; exit 1; }
          mkdir dist
          # The archives carry the version the build stamped: a tag that does not match the
          # version in CMakeLists.txt finds no files here and stops the release.
          mv "kits/package-windows/laeticias-corner-$version-windows-x64.zip" \
             "kits/package-linux/laeticias-corner-$version-linux-x86_64.tar.gz" dist/
          (cd dist && sha256sum -- * > SHA256SUMS.txt && cat SHA256SUMS.txt)
          gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --verify-tag \
            --draft --prerelease --title "Laeticia's Corner $version" --notes-file "$notes"
